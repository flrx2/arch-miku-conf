# === Kitty — тема "Midnight Rei" ===
# Palette: deep navy, cold blue accent, terminal-functional

# --- Внешний вид ---
background_opacity 0.75
dynamic_background_opacity yes
window_padding_width 6
confirm_os_window_close 0
draw_minimal_borders yes
window_border_width 0

# --- Шрифт ---
font_family monospace
font_size 11.5

# --- Цвета ---
background            #0a0d14
foreground            #c8d8f0

selection_background  #1e3a5f
selection_foreground  #e8f0ff

cursor                #4da6ff
cursor_text_color     #0a0d14

# --- Стандартные 16 цветов ---

# Black
color0   #0d1117
color8   #1e2840

# Red (ошибки)
color1   #e05c7a
color9   #ff7a96

# Green (успех, git diff +)
color2   #4ecbb4
color10  #6ee8d0

# Yellow (предупреждения)
color3   #7eb8d4
color11  #a0d4ef

# Blue (ссылки, директории)
color4   #4d8fff
color12  #70aaff

# Magenta (спецсимволы, ветки)
color5   #7b8cde
color13  #9daaff

# Cyan (акцент, пути)
color6   #00ccd6
color14  #33e8f0

# White
color7   #aec4e0
color15  #ddeeff
